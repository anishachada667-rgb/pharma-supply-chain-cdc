name: Validate Pharma Data Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SOURCE_DB_PASSWORD: ci-placeholder
      WAREHOUSE_DB_PASSWORD: ci-placeholder
      DBT_ENV_SECRET_WAREHOUSE_PASSWORD: ci-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install \
            "dbt-core==1.12.5" \
            "dbt-postgres==1.11.0"

      - name: Check Python syntax
        run: |
          python -m compileall -q ingestion scripts dashboard airflow/dags

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.cdc.yaml \
            -f compose.airflow.yaml \
            config --quiet

      - name: Parse dbt models, snapshots, and tests
        run: |
          dbt parse \
            --project-dir dbt \
            --profiles-dir dbt \
            --no-partial-parse